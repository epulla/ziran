name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PLIST_VERSION="$(/usr/bin/plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          if [[ "$VERSION" != "$PLIST_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Info.plist version $PLIST_VERSION"
            exit 1
          fi
          ARCHS="arm64 x86_64" make bundle
          ditto -c -k --keepParent dist/Ziran.app "Ziran-$VERSION.zip"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Ziran-$VERSION.zip" --verify-tag --generate-notes --title "Ziran $VERSION"
