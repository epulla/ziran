name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PLIST_VERSION="$(/usr/bin/plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          if [[ "$VERSION" != "$PLIST_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Info.plist version $PLIST_VERSION"
            exit 1
          fi
          ARCHS="arm64 x86_64" make bundle
          ditto -c -k --keepParent dist/Ziran.app "Ziran-$VERSION.zip"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Ziran-$VERSION.zip" --verify-tag --generate-notes --title "Ziran $VERSION"

      - uses: actions/checkout@v4
        with:
          repository: epulla/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: Bump Homebrew cask
        working-directory: homebrew-tap
        run: |
          SHA="$(shasum -a 256 "../Ziran-$VERSION.zip" | cut -d ' ' -f 1)"
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/ziran.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ziran $VERSION"
          git push
